<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a7bd5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <circle cx="960" cy="540" r="450" fill="url(#glow)" />

  <!-- Geometric Grid Accent -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.05">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Central Bobzzite Emblem -->
  <g transform="translate(960, 500)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round" />
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="#182238" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.5" />
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">b</text>
  </g>

  <!-- Typography -->
  <text x="960" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">BOBZZITE</text>
  <text x="960" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#00d2ff" text-anchor="middle" letter-spacing="4">GAMING &amp; CREATIVE FEDORA ATOMIC OS</text>
</svg>
