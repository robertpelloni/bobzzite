name: Build and Validate Bobzzite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily build at midnight
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  validate:
    name: Validate Repository and Matrix Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build validation suite
        run: python3 scripts/validate_build.py

      - name: Verify script syntax
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/*.sh

      - name: Validate hardware profile assertions
        run: bash scripts/bobzzite-profile-validate.sh all

      - name: Run hardware compatibility check
        run: bash scripts/bobzzite-compat.sh check

  build:
    name: Build Flavor (${{ matrix.flavor }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [bobzzite, bobzzite-deck, bobzzite-nvidia]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate flavor configuration & test matrix
        run: |
          bash scripts/build-flavors.sh ${{ matrix.flavor }} check
          bash scripts/build-flavors.sh ${{ matrix.flavor }} export-profile
          bash scripts/build-flavors.sh ${{ matrix.flavor }} config
          cat .flavor-config.env

      - name: Image Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ matrix.flavor }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Flavor Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          build-args: |
            BASE_IMAGE=${{ matrix.flavor == 'bobzzite-deck' && 'ghcr.io/ublue-os/bazzite-deck:latest' || (matrix.flavor == 'bobzzite-nvidia' && 'ghcr.io/ublue-os/bazzite-nvidia:latest' || 'ghcr.io/ublue-os/bazzite:latest') }}
            IMAGE_NAME=${{ matrix.flavor }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
